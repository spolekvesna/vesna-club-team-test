name: TEAM TEST check
on:
  push:
    branches: [team-test-feedback-2026-11-03]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: APP_ENV=test DATABASE_URL=sqlite:///./ci.sqlite alembic upgrade head
      - run: APP_ENV=test DATABASE_URL=sqlite:///./ci.sqlite pytest -q
