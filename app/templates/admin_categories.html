{% extends 'base.html' %}{% block content %}<h1>Kategorie číselníků</h1><p><a href="/admin/catalog">← položky číselníků</a></p><div class="card"><form class="grid" method="post" action="/admin/categories/new"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Technický klíč<input name="key" required placeholder="NovaKategorie"></label><label>Název<input name="name" required></label><label>Pořadí<input type="number" name="sort_order" value="99"></label><div class="actions" style="align-self:end"><button class="primary">Přidat kategorii</button></div></form></div><div class="card mobile-table"><table><thead><tr><th>Klíč</th><th>Název</th><th>Pořadí</th><th>Aktivní</th><th></th></tr></thead><tbody>{% for c in categories %}<tr><form method="post" action="/admin/categories/{{ c.id }}/edit"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="version" value="{{ c.version }}"><td class="code">{{ c.key }}</td><td><input name="name" value="{{ c.name }}"></td><td><input type="number" name="sort_order" value="{{ c.sort_order }}"></td><td><select name="active"><option value="true" {% if c.active %}selected{% endif %}>ano</option><option value="false" {% if not c.active %}selected{% endif %}>ne</option></select></td><td><button>Uložit</button></td></form></tr>{% endfor %}</tbody></table></div>{% endblock %}
