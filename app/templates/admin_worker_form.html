{% extends 'base.html' %}{% block content %}<h1>{{ 'Nový pracovník' if not worker else 'Upravit pracovníka' }}</h1><form class="card grid two" method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if worker %}<input type="hidden" name="version" value="{{ worker.version }}">{% endif %}<label>Jméno<input name="name" required value="{{ worker.name if worker else '' }}"></label><label>E-mail<input type="email" name="email" required value="{{ worker.email if worker else '' }}"></label><label>Role<select name="role"><option value="admin" {% if worker and worker.role=='admin' %}selected{% endif %}>správce</option><option value="worker" {% if not worker or worker.role=='worker' %}selected{% endif %}>pracovník</option><option value="reader" {% if worker and worker.role=='reader' %}selected{% endif %}>čtenář/reporting</option></select></label><label>Aktivní<select name="active"><option value="true" {% if not worker or worker.active %}selected{% endif %}>Ano</option><option value="false" {% if worker and not worker.active %}selected{% endif %}>Ne</option></select></label><label class="span">Lokální testovací heslo<input type="password" name="password" placeholder="v produkci přes Google Workspace"></label><div class="actions span"><button class="primary">Uložit</button><a class="button" href="/admin/workers">Zpět</a></div></form>{% endblock %}
